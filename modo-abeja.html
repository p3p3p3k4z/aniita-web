<!DOCTYPE html>
<html lang="es">
<head>
    <title>Modo Abeja - Isla Polinizadora de Chiapas</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        /* Pantalla de carga mejorada */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111;
            color: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            transition: opacity 0.5s;
        }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>

<body>
    <div id="loader">
        <h1>Cargando Ecosistema...</h1>
        <p>Por favor espera</p>
    </div>

    <a-scene 
        background="color: #87CEEB" 
        renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
        fog="type: exponential; color: #87CEEB; density: 0.002">

        <a-assets>
            <a-asset-item id="oaxaca-model" src="modelos/isla_oaxaca.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#BBB" intensity="1.5"></a-light>
        <a-light type="directional" color="#FFF" intensity="2" position="-1 10 5"></a-light>

        <a-plane position="0 -1 0" rotation="-90 0 0" width="500" height="500" color="#5C4033"></a-plane>

        <a-gltf-model 
            id="island-model" 
            src="#oaxaca-model" 
            scale="1 1 1" 
            position="0 0 0">
        </a-gltf-model>

        <a-entity id="rig" movement-controls="fly: true; speed: 0.5" position="0 5 10">
            <a-entity 
                camera 
                position="0 1.6 0" 
                look-controls="pointerLockEnabled: true">
                <a-cursor color="yellow" scale="0.5 0.5 0.5"></a-cursor> 
            </a-entity>
        </a-entity>
        
    </a-scene>

    <script>
        // Script para ocultar el loader cuando el modelo esté listo
        document.querySelector('a-scene').addEventListener('loaded', function () {
            const loader = document.getElementById('loader');
            // Esperamos un segundo extra para asegurar estabilidad
            setTimeout(() => {
                loader.classList.add('hidden');
            }, 1000);
        });

        // Click para iniciar (bloqueo de puntero)
        document.addEventListener('click', function () {
            const scene = document.querySelector('a-scene');
            scene.canvas.requestPointerLock();
        });
    </script>
</body>
</html>
